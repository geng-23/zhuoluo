    <rect x="308" y="444" width="408" height="14" rx="7" fill="#8FC9A8"/>
    <!-- 日期格线 -->
    <rect x="380" y="472" width="10" height="190" rx="5" fill="#8FC9A8"/>
    <rect x="634" y="472" width="10" height="190" rx="5" fill="#8FC9A8"/>
    <rect x="308" y="536" width="408" height="10" rx="5" fill="#8FC9A8"/>
    <!-- 对勾 -->
    <path d="M 380 558 L 470 632 L 634 460"
